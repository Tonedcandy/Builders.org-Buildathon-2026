[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3